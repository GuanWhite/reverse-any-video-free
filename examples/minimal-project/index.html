<!doctype html>
<!--
  reverse-any-video-free · 可编辑工程骨架模板

  使用前：
  1. 用 `python scripts/probe.py --video input.mp4 --out probe.json` 得到真实数值，
     替换下面所有 data-width / data-height / data-fps / data-duration。
  2. 把原片原样复制为 assets/source.mp4（不转码），音轨整条直挂、画面 clip 静音。
  3. 把裁切出的子素材放进 assets/；文字/图形一律用 HTML 重写。
  4. 动画库任选。为保持离线，把 gsap.min.js 放进 assets/ 后用本地路径引用，
     不要引 CDN；没有动画库时删掉 <script> 段，静态场景同样能被渲染。
  5. 严禁添加覆盖整帧的 <video src="assets/source.mp4"> 层。

  本模板不含真实素材，不能单独渲染；它是结构与契约的示例。
  完整契约见 ../../references/composition.md。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Reverse project</title>
  <style>
    html, body { margin: 0; padding: 0; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #101014; }
    .clip { position: absolute; }
    #scene01 { inset: 0; }
    .headline {
      left: 240px; top: 420px; width: 1440px;
      color: #ffffff; font-family: sans-serif; font-size: 96px; font-weight: 700;
      text-align: center; letter-spacing: 2px;
    }
    .caption-band {
      left: 240px; top: 860px; width: 1440px;
      color: #ffffff; font-family: sans-serif; font-size: 44px; text-align: center;
    }
    .logo-cut { left: 80px; top: 80px; width: 220px; height: 220px; object-fit: contain; }
  </style>
</head>
<body>
  <!-- 根合成：数值全部来自 probe.json；duration = frames / fps -->
  <div id="root" data-composition-id="root"
       data-width="1920" data-height="1080"
       data-fps="30000/1001" data-duration="12.345678">

    <!-- 原音轨整条直挂；不抽取、不重编码。所有画面片段必须静音 -->
    <audio id="source-audio" src="assets/source.mp4"
           data-start="0" data-duration="12.345678"></audio>

    <!-- 一个镜头 = 一个子合成宿主；时间写 帧 ÷ fps 向下截断 6 位 -->
    <div id="scene01" class="clip" data-composition-id="scene01"
         data-start="0" data-duration="2.766666" data-track-kind="graphics">

      <!-- 组件：文字用 HTML 重建，不由脚本动态生成，id 保持稳定 -->
      <div id="headline-a" class="clip headline" data-start="0.266666" data-duration="2.0"
           data-var-text="headline">复刻标题</div>

      <!-- 组件：字幕组放在同一个 captions 宿主里；切换帧取自字幕带像素 -->
      <div id="captions" class="clip" data-start="0" data-duration="2.766666"
           data-track-kind="captions">
        <div id="cap-1" class="clip caption-band" data-start="0.300000" data-duration="1.200000">第一句</div>
      </div>

      <!-- 子素材：从原帧按自己的框裁切，绝不使用整帧原片 -->
      <img id="logo-cut" class="clip logo-cut" src="assets/cut_logo.png"
           data-start="0" data-duration="2.766666" data-var-src="logo" alt="logo">
    </div>
  </div>

  <!-- 离线动画库（自行放入 assets/）；没有则删除下面两段脚本 -->
  <script src="assets/gsap.min.js"></script>
  <script>
    // 每个子合成构建一条「暂停的」timeline，注册在 tween 之后。
    // tween 只能作用于时间；禁止 Date.now / Math.random / 定时器 / 网络请求 / repeat:-1。
    if (window.gsap) {
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#headline-a", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4 }, 0.266666);
      window.__timelines = window.__timelines || {};
      window.__timelines["scene01"] = tl;
    }
  </script>
</body>
</html>
